name: Build and Release Desktop App (Linux)

on:
  push:
    tags:
      - 'v*' # Dispara o workflow quando uma tag começando com 'v' é enviada

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debian Package
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew :desktop:packageDeb

      - name: Upload DEB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
