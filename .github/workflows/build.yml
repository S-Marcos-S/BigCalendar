name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
      - termux
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore with Python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          python3 -c "
          import base64, os, sys
          data = os.environ.get('KEYSTORE_BASE64', '').strip()
          if not data:
              print('Erro: KEYSTORE_BASE64 nao encontrado')
              sys.exit(1)
          
          clean_data = ''.join(data.split())
          
          # Ajusta o padding apenas quando necessario (2 ou 3 caracteres restantes)
          missing_padding = len(clean_data) % 4
          if missing_padding == 2:
              clean_data += '=='
          elif missing_padding == 3:
              clean_data += '='
          
          try:
              with open('app/key01.jks', 'wb') as f:
                  f.write(base64.b64decode(clean_data))
              print('Keystore decodificada com sucesso via Python!')
          except Exception as e:
              print(f'Erro ao decodificar (tamanho={len(clean_data)}): {e}')
              sys.exit(1)
          "

      - name: Create keystore.properties
        run: |
          cat <<EOF > app/keystore.properties
          storeFile=key01.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cp app/keystore.properties keystore.properties

      - name: Configure gradle.properties for CI
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigCalendar-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with Automatic Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


