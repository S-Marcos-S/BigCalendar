name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
      - termux
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore with Python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          python3 -c "
          import base64, os, sys
          data = os.environ.get('KEYSTORE_BASE64', '').strip()
          if not data:
              print('Erro: KEYSTORE_BASE64 nao encontrado')
              sys.exit(1)
          
          clean_data = ''.join(data.split())
          
          # Ajusta o padding apenas quando necessario (2 ou 3 caracteres restantes)
          missing_padding = len(clean_data) % 4
          if missing_padding == 2:
              clean_data += '=='
          elif missing_padding == 3:
              clean_data += '='
          
          try:
              with open('app/key01.jks', 'wb') as f:
                  f.write(base64.b64decode(clean_data))
              print('Keystore decodificada com sucesso via Python!')
          except Exception as e:
              print(f'Erro ao decodificar (tamanho={len(clean_data)}): {e}')
              sys.exit(1)
          "

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 -c "
          import os
          store_pass = os.environ.get('STORE_PASSWORD', '').strip()
          key_alias = os.environ.get('KEY_ALIAS', '').strip()
          key_pass = os.environ.get('KEY_PASSWORD', '').strip()
          
          # Garante o alias exato do keystore
          if not key_alias or key_alias != 'tbc-key01':
              key_alias = 'tbc-key01'
          
          with open('app/keystore.properties', 'w') as f:
              f.write(f'storeFile=key01.jks\nstorePassword={store_pass}\nkeyAlias={key_alias}\nkeyPassword={key_pass}\n')
          
          with open('keystore.properties', 'w') as f:
              f.write(f'storeFile=key01.jks\nstorePassword={store_pass}\nkeyAlias={key_alias}\nkeyPassword={key_pass}\n')
          print('keystore.properties gerado com sucesso com alias:', key_alias)
          "

      - name: Configure gradle.properties for CI
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i 's/-Xmx2048m/-Xmx6144m/' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigCalendar-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with Automatic Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


