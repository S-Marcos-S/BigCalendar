name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Erro: O segredo KEYSTORE_BASE64 nao esta preenchido no GitHub!"
            exit 1
          fi
          # Remove quebras de linha e espacos antes de decodificar
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/key01.jks

      - name: Create keystore.properties
        run: |
          cat <<EOF > app/keystore.properties
          storeFile=key01.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigCalendar-Release-APK
          path: app/build/outputs/apk/release/*.apk
